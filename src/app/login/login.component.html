<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f5f5f5;
    }
    .p-card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        border-radius: 16px;
    }
    .full-width {
        width: 100%;
        margin-bottom: 1rem;
    }
    h2 {
        text-align: center;
        margin-bottom: 2rem;
    }
</style>
<div class="login-container">
    <p-card>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <h2>Iniciar Sesión</h2>
            <div class="full-width">
                <label for="rol">Rol</label>
                <p-select [options]="roles" optionLabel="viewValue" optionValue="value" formControlName="rol" placeholder="Seleccione rol"></p-select>
                <small *ngIf="rol?.hasError('required') && rol?.touched" class="p-error">El rol es obligatorio.</small>
            </div>
            <div class="full-width">
                <label for="usuario">Usuario</label>
                <input pInputText formControlName="usuario" autocomplete="username" />
                <small *ngIf="usuario?.hasError('required') && usuario?.touched" class="p-error">El usuario es obligatorio.</small>
            </div>
            <div class="full-width">
                <label for="contrasena">Contraseña</label>
                <div style="display: flex; align-items: center;">
                    <input pInputText [type]="hidePassword ? 'password' : 'text'" formControlName="contrasena" autocomplete="current-password" style="flex:1;" />
                    <button pButton type="button" icon="pi pi-eye" (click)="togglePasswordVisibility()" style="margin-left: 0.5rem;"></button>
                </div>
                <small *ngIf="contrasena?.hasError('required') && contrasena?.touched" class="p-error">La contraseña es obligatoria.</small>
            </div>
            <button pButton type="submit" label="Login" [disabled]="loginForm.invalid" class="full-width p-button-primary"></button>
        </form>
        <div *ngIf="mensajeAcceso" style="margin-top: 1rem; text-align: center; color: #1976d2; font-weight: bold;">
            {{ mensajeAcceso }}
        </div>
    </p-card>
</div>
