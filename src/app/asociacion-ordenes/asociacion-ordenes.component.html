<div style="margin: 2rem;">
  <form>
    <!-- <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 1rem;">
      <mat-label>Buscar orden</mat-label>
      <input matInput name="buscarOrden">
    </mat-form-field> -->

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%; margin-bottom: 1rem;">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>
      <ng-container matColumnDef="orden">
        <th mat-header-cell *matHeaderCellDef> No. Orden </th>
        <td mat-cell *matCellDef="let element"> {{element.orden}} </td>
      </ng-container>
      <ng-container matColumnDef="tipologia">
        <th mat-header-cell *matHeaderCellDef> Tipologia </th>
        <td mat-cell *matCellDef="let element"> {{element.tipologia}} </td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- <button mat-raised-button color="primary" style="width: 100%;">Guardar</button> -->
  </form>
</div>
